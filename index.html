<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="zaybal">
        <div>
          <img src="logo.svg" alt="Bono logo" />
        </div>
        <div class="contact">
          <a href="mailto:contact@bono.com">
            <i class="fa-solid fa-envelope"></i>
            contact@bono.com
          </a>
          <a href="tel:(+31)021-800-8244">
            <i class="fa-solid fa-phone"></i>(+31)021-800-8244
            <i class="fa-brands fa-twitter"></i>
          </a>
        </div>
      </div>
      <div class="main">
        <form class="text text-1">
          <label for="name">Name</label>
          <input type="text" name="name" id="name" />
          <label for="email">Email</label>
          <input type="text" name="email" id="email" />
          <label for="message">Message</label>
          <!-- <input type="text" id="message" class="message" /> -->
          <textarea name="" id="message"></textarea>
          <button>Submit</button>
        </form>
        <aside class="text text-2">
          <h1>Coming Soon For Every Developer</h1>
          <p>
            Our new Bono web app will change the way you think about content
            management and will allow you to focus on what's really important.
            Use the contact form to send us your thoughts
          </p>
        </aside>
      </div>
    </div>
  </body>
</html>
